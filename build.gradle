plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.4.2'
}

group 'edu.pucmm.eict'
version '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'edu.pucmm.eict.ormjpa.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //dependencia de Javalin
    implementation 'io.javalin:javalin:6.7.0'

    //manejo de log.
    implementation 'org.slf4j:slf4j-simple:2.0.18'

    implementation 'org.jasypt:jasypt:1.9.3'

    // En la versión 7 cada motor de plantilla se distribuye en su propio módulo.
    implementation 'io.javalin:javalin-rendering:6.7.0'

    //Procesamiento JSON para Javalin.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.0')
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    //ORM - Hibernate.
    implementation 'org.hibernate.orm:hibernate-core:7.4.0.Final'

    //Driver de la conexión en h2...
    implementation 'com.h2database:h2:2.4.240'
    implementation 'org.postgresql:postgresql:42.7.11'

    //sistemas de plantilla:
    implementation 'org.thymeleaf:thymeleaf:3.1.5.RELEASE'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('app')
    archiveClassifier.set('')
    archiveVersion.set('')
}

/**
 * tarea necesaria para heroku si optamos por la tarea de Shadowjar
 * en el archivo Procfile debe estar el siguiente comando:
 * web: java -jar build/libs/app.jar
 */
tasks.register('stage') {
    dependsOn 'shadowJar'
}
