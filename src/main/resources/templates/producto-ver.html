<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <title th:text="${producto.nombre}">Producto</title>
</head>
<body>
<div class="container" style="margin-top: 40px;">
    <a class="btn btn-secondary mb-3" href="/productos">Volver</a>
    <h1 th:text="${producto.nombre}">Nombre</h1>
    <p class="lead" th:text="'Precio: ' + ${producto.precio}">Precio</p>
    <p th:text="${producto.descripcion}">Descripción</p>

    <h4>Imágenes</h4>
    <div class="row">
        <div class="col-md-3 mb-3" th:each="img : ${producto.imagenes}">
            <img class="img-fluid"
                 th:src="'data:' + ${img.mimeType} + ';base64,' + ${img.imagenBase64}">
        </div>
    </div>

    <hr/>
    <h4>Comentarios</h4>
    <ul class="list-group mb-3">
        <li class="list-group-item" th:if="${producto.comentarios.isEmpty()}">Sin comentarios.</li>
        <li class="list-group-item" th:each="comentario : ${producto.comentarios}">
            <strong th:text="${comentario.usuario.username}">usuario</strong>
            <small class="text-muted" th:text="${comentario.fecha}">fecha</small>
            <p class="mb-0" th:text="${comentario.texto}">texto</p>
        </li>
    </ul>

    <div th:if="${usuario != null}">
        <form th:action="@{'/productos/' + ${producto.id} + '/comentario'}" method="post">
            <div class="form-group">
                <textarea class="form-control" name="texto" rows="2" placeholder="Escribe un comentario" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Comentar</button>
        </form>
    </div>
    <div th:if="${usuario == null}">
        <a href="/login">Inicia sesión para comentar</a>
    </div>
</div>
</body>
</html>
