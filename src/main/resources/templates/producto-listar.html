<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <title>Productos</title>
</head>
<body>
<div class="container" style="margin-top: 40px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Productos</h1>
        <a class="btn btn-primary" href="/productos/crear">Nuevo Producto</a>
    </div>
    <table class="table">
        <thead>
        <tr>
            <th>#</th>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="producto : ${productos}">
            <td th:text="${producto.id}">1</td>
            <td>
                <img th:if="${!producto.imagenes.isEmpty()}"
                     th:src="'data:' + ${producto.imagenes[0].mimeType} + ';base64,' + ${producto.imagenes[0].imagenBase64}"
                     style="height: 50px;">
            </td>
            <td th:text="${producto.nombre}">Nombre</td>
            <td th:text="${producto.precio}">0.0</td>
            <td>
                <a class="btn btn-sm btn-info" th:href="@{'/productos/' + ${producto.id}}">Ver</a>
                <a class="btn btn-sm btn-warning" th:href="@{'/productos/editar/' + ${producto.id}}">Editar</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/productos/eliminar/' + ${producto.id}}">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
